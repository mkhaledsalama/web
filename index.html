<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web App Mastery — Complete Web Application Development Learning Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
/* ==========================================================================
   Web App Mastery — Color System & Themes (css/themes.css)
   Warm Cream, Beige, Coffee Brown & Espresso Palette (Zero Blue/Purple)
   ========================================================================== */

:root {
  --bg: #F6F1E7;
  --surface: #FCF9F3;
  --beige: #EAE1D2;
  --coffee: #5C3D2E;
  --coffee-hover: #462D21;
  --coffee-soft: rgba(92, 61, 46, 0.10);
  --cinnamon: #9C5B38;
  --text: #2A201A;
  --muted: #6E5F55;
  --border: #DDD2C2;

  --ok: #3D5E3A;
  --ok-bg: #E7F0E5;
  --err: #96352A;
  --err-bg: #F6E6E3;
  --warn: #8E6522;
  --warn-bg: #F5EEE0;

  --code-bg: #241D18;
  --code-fg: #F4EDE2;

  --font-en: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-serif: 'Source Serif 4', Georgia, serif;
  --font-ar: 'Cairo', 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --radius: 6px;
  --shadow: 0 1px 3px rgba(42, 32, 26, 0.06);
  --sidebar-w: 252px;
}

[data-theme="dark"] {
  --bg: #181310;
  --surface: #241D18;
  --beige: #312822;
  --coffee: #C99A72;
  --coffee-hover: #B8865D;
  --coffee-soft: rgba(201, 154, 114, 0.14);
  --cinnamon: #D79C6E;
  --text: #F4EDE2;
  --muted: #B7A99A;
  --border: #3D322B;

  --ok: #8DB888;
  --ok-bg: rgba(61, 94, 58, 0.34);
  --err: #E68F85;
  --err-bg: rgba(150, 53, 42, 0.30);
  --warn: #DFB874;
  --warn-bg: rgba(142, 101, 34, 0.28);

  --code-bg: #120E0C;
  --code-fg: #F4EDE2;

  --shadow: 0 2px 10px rgba(0, 0, 0, 0.36);
}


/* ==========================================================================
   Web App Mastery — Core Layout & Components (css/style.css)
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }
html { font-size: 16px; overflow-x: hidden; scroll-behavior: smooth; }
body {
  margin: 0;
  background-color: var(--bg);
  color: var(--text);
  font-family: var(--font-en);
  line-height: 1.6;
  overflow-x: hidden;
  transition: background-color 0.2s ease, color 0.2s ease;
}
[dir="rtl"] body { font-family: var(--font-ar); }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }
code, pre { font-family: var(--font-mono); }

/* Shell */
.app-shell { display: flex; min-height: 100vh; width: 100%; }

.sidebar {
  position: fixed; top: 0; bottom: 0; inset-inline-start: 0;
  width: var(--sidebar-w); background-color: var(--surface);
  border-inline-end: 1px solid var(--border);
  padding: 18px 14px; display: flex; flex-direction: column; gap: 12px;
  z-index: 150; transform: translateX(-105%);
  transition: transform 0.22s ease; overflow-y: auto;
}
[dir="rtl"] .sidebar { transform: translateX(105%); }
.sidebar.open { transform: translateX(0); }

.sidebar-backdrop {
  position: fixed; inset: 0; background: rgba(24, 19, 16, 0.5);
  display: none; z-index: 140;
}
.sidebar-backdrop.open { display: block; }

.brand-box {
  padding: 6px 10px 14px; border-bottom: 1px solid var(--border);
}
.brand-title { font-family: var(--font-serif); font-weight: 800; font-size: 1.08rem; color: var(--coffee); letter-spacing: -0.01em; }
.brand-sub { font-size: 0.74rem; color: var(--muted); }

.side-nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.side-btn {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; padding: 9px 12px; border-radius: 4px;
  background: transparent; border: 1px solid transparent;
  font-size: 0.87rem; font-weight: 600; color: var(--muted); text-align: start;
  transition: background-color 0.15s ease, color 0.15s ease;
}
.side-btn:hover { background-color: var(--beige); color: var(--text); }
.side-btn.active { background-color: #5C3D2E; color: #FCF9F3; }

.content-area { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  position: sticky; top: 0; z-index: 100; height: 60px;
  background-color: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.breadcrumb { font-size: 0.86rem; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

.ctrl-btn {
  min-height: 36px; padding: 6px 10px; border-radius: 4px;
  background-color: var(--beige); border: 1px solid var(--border);
  font-size: 0.82rem; font-weight: 700;
}
.ctrl-btn:hover { border-color: var(--coffee); }

.main-inner { max-width: 1100px; width: 100%; margin: 0 auto; padding: 20px 16px 68px; }
.view { display: none; animation: fadeIn 0.2s ease; }
.view.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

/* Common Components */
.page-head { margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
.eyebrow { font-size: 0.74rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--cinnamon); }
.page-title { margin: 4px 0 4px; font-family: var(--font-serif); font-size: 1.65rem; line-height: 1.25; }
[dir="rtl"] .page-title { font-family: var(--font-ar); }
.page-sub { margin: 0; font-size: 0.92rem; color: var(--muted); }

.card { background-color: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
.card-beige { background-color: var(--beige); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 38px; padding: 7px 15px; border-radius: 4px;
  font-size: 0.88rem; font-weight: 600; border: 1px solid transparent; white-space: nowrap;
  transition: background-color 0.15s ease, border-color 0.15s ease;
}
.btn-primary { background-color: #5C3D2E; color: #FCF9F3; border-color: #5C3D2E; }
.btn-primary:hover { background-color: #462D21; }
.btn-secondary { background-color: var(--surface); color: var(--text); border-color: var(--border); }
.btn-secondary:hover { background-color: var(--beige); border-color: var(--coffee); }
.btn-danger { background-color: var(--err); color: #FCF9F3; }
.btn-sm { min-height: 32px; padding: 5px 11px; font-size: 0.82rem; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 4px; font-size: 0.74rem; font-weight: 700; }
.badge-ok { background-color: var(--ok-bg); color: var(--ok); }
.badge-err { background-color: var(--err-bg); color: var(--err); }
.badge-warn { background-color: var(--warn-bg); color: var(--warn); }
.badge-beige { background-color: var(--beige); color: var(--muted); border: 1px solid var(--border); }

.input, .select, .textarea {
  width: 100%; padding: 8px 12px; background-color: var(--surface);
  border: 1px solid var(--border); border-radius: 4px; color: var(--text);
}
.input, .select { min-height: 38px; }
.textarea { min-height: 120px; resize: vertical; line-height: 1.55; }
.code-editor {
  width: 100%; min-height: 170px; padding: 12px; border-radius: 4px;
  background-color: var(--code-bg); color: var(--code-fg);
  border: 1px solid var(--border); font-family: var(--font-mono);
  font-size: 0.86rem; line-height: 1.55; resize: vertical;
}
.input:focus, .select:focus, .textarea:focus, .code-editor:focus { outline: 2px solid var(--coffee); outline-offset: 1px; }

.stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 18px; }
.stat-box { background-color: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
.stat-k { font-size: 0.72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; }
.stat-v { font-size: 1.44rem; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; }

.grid-2 { display: grid; grid-template-columns: 1fr; gap: 14px; }
.grid-3 { display: grid; grid-template-columns: 1fr; gap: 14px; }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.tab {
  padding: 6px 11px; border-radius: 4px; background-color: var(--surface);
  border: 1px solid var(--border); font-size: 0.82rem; font-weight: 600; color: var(--muted);
}
.tab.active { background-color: #5C3D2E; color: #FCF9F3; border-color: #5C3D2E; }

.progress-track { width: 100%; height: 8px; background-color: var(--beige); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background-color: var(--coffee); transition: width 0.3s ease; }

/* Code, Preview & Tables */
.code-box {
  background-color: var(--code-bg); color: var(--code-fg); padding: 13px 15px;
  border-radius: 4px; overflow-x: auto; font-size: 0.85rem; line-height: 1.55;
  margin: 8px 0; white-space: pre-wrap; word-break: break-word;
}
.preview-frame {
  width: 100%; min-height: 220px; border: 1px solid var(--border);
  border-radius: 4px; background-color: #FFFFFF;
}
.demo-box {
  background-color: var(--surface); border: 1px solid var(--border);
  border-radius: 4px; padding: 14px; margin-top: 8px;
}

.table-wrap { width: 100%; overflow-x: auto; border: 1px solid var(--border); border-radius: 4px; margin: 10px 0; }
.table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
.table th, .table td { padding: 8px 11px; text-align: start; border-bottom: 1px solid var(--border); }
.table th { background-color: var(--beige); font-weight: 700; }

/* Options & Feedback */
.opt-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.opt-btn {
  display: flex; align-items: flex-start; gap: 10px; width: 100%;
  padding: 12px 14px; text-align: start; background-color: var(--beige);
  border: 1px solid var(--border); border-radius: 4px; font-size: 0.91rem;
}
.opt-btn:hover:not(:disabled) { border-color: var(--coffee); }
.opt-btn.selected { border-color: var(--coffee); background-color: var(--coffee-soft); font-weight: 600; }
.opt-btn.ok { border-color: var(--ok); background-color: var(--ok-bg); font-weight: 700; }
.opt-btn.err { border-color: var(--err); background-color: var(--err-bg); }
.opt-key { min-width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; border-radius: 4px; background-color: var(--surface); border: 1px solid var(--border); font-weight: 700; font-size: 0.8rem; flex-shrink: 0; }

.fb-box { margin-top: 12px; padding: 12px 14px; border-radius: 4px; border: 1px solid var(--border); font-size: 0.89rem; }
.fb-box.ok { background-color: var(--ok-bg); border-color: var(--ok); }
.fb-box.err { background-color: var(--err-bg); border-color: var(--err); }
.fb-box.warn { background-color: var(--warn-bg); border-color: var(--warn); }

.ar-box {
  background-color: var(--beige); border-inline-start: 3px solid var(--cinnamon);
  padding: 13px 15px; border-radius: 4px; direction: rtl; text-align: right;
  font-family: var(--font-ar); font-size: 0.94rem;
}

.kw-chip { display: inline-flex; padding: 3px 8px; border-radius: 4px; font-size: 0.78rem; font-weight: 700; border: 1px solid var(--border); background: var(--beige); font-family: var(--font-mono); }
.kw-chip.hit { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }

/* Flashcard */
.flash-card {
  max-width: 680px; margin: 0 auto 16px; min-height: 235px;
  background-color: var(--surface); border: 1px solid var(--border);
  border-top: 4px solid #5C3D2E; border-radius: var(--radius);
  padding: 24px 20px; display: flex; flex-direction: column; justify-content: center; gap: 10px;
  cursor: pointer; transition: transform 0.2s ease;
}
.flash-card:hover { transform: translateY(-2px); }

/* Modal & Toast */
.modal-bg { position: fixed; inset: 0; background: rgba(24, 19, 16, 0.58); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 250; }
.modal-bg.open { display: flex; }
.modal-box { background-color: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); max-width: 440px; width: 100%; padding: 20px; }
.toast { position: fixed; bottom: 20px; inset-inline-end: 20px; z-index: 300; background-color: #2A201A; color: #FCF9F3; padding: 10px 16px; border-radius: 4px; border-inline-start: 4px solid #C99A72; font-size: 0.86rem; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
.toast.show { opacity: 1; }
.empty-box { text-align: center; padding: 24px 16px; background-color: var(--beige); border: 1px dashed var(--border); border-radius: var(--radius); color: var(--muted); }


/* ==========================================================================
   Web App Mastery — Responsive Breakpoints (css/responsive.css)
   ========================================================================== */

@media (min-width: 768px) {
  .main-inner { padding: 26px 24px 72px; }
  .stats-grid { grid-template-columns: repeat(4, 1fr); }
  .grid-2 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: repeat(2, 1fr); }
}

@media (min-width: 1024px) {
  .sidebar { position: sticky; transform: none !important; height: 100vh; flex-shrink: 0; }
  .mobile-menu-btn, .sidebar-backdrop { display: none !important; }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
}

@media (max-width: 420px) {
  .card { padding: 14px; }
  .ctrl-btn { padding: 5px 8px; font-size: 0.76rem; }
  .page-title { font-size: 1.4rem; }
}

  </style>
</head>

  <script>
/* ==========================================================================
   Web App Mastery — LocalStorage Manager (js/storage.js)
   Persists progress, study streak, daily goal, scores, code attempts & theme.
   ========================================================================== */

window.WAM_STORAGE = (function () {
  var KEY = 'wam_learning_hub_v1';
  var mem = null;

  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function yesterday() {
    var d = new Date(Date.now() - 86400000);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function defaults() {
    return {
      lang: 'en',
      theme: 'light',
      lastLessonId: 'l1',
      completedLessons: [],
      dailyGoal: 10,
      dailyDone: 0,
      streak: 1,
      lastDate: today(),
      qBankCompleted: [],
      qBankFavorites: [],
      qBankDifficult: [],
      mcqStats: {},         /* qId -> { attempts, correct, wrong } */
      examHistory: [],      /* { ts, mode, correct, total, pct } */
      essayDrafts: {},      /* essayId -> { text, rubricScore, tagHits, tagTotal, savedAt } */
      flashStatus: {},      /* cardId -> 'know' | 'dont' */
      gameBest: {},         /* gameId -> bestScore */
      recentActivity: []
    };
  }

  function load() {
    try {
      var raw = window.localStorage.getItem(KEY);
      if (!raw) return defaults();
      return Object.assign(defaults(), JSON.parse(raw));
    } catch (e) {
      return mem ? Object.assign(defaults(), mem) : defaults();
    }
  }

  function save(st) {
    mem = st;
    try { window.localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {}
  }

  function update(fn) {
    var st = load();
    var td = today();
    if (st.lastDate !== td) {
      st.streak = (st.lastDate === yesterday()) ? (st.streak || 1) + 1 : 1;
      st.lastDate = td;
      st.dailyDone = 0;
    }
    fn(st);
    save(st);
    return st;
  }

  function log(st, title, detail) {
    st.recentActivity = st.recentActivity || [];
    st.recentActivity.unshift({ title: title, detail: detail, ts: Date.now() });
    if (st.recentActivity.length > 15) st.recentActivity = st.recentActivity.slice(0, 15);
  }

  function recordMcq(qId, isCorrect) {
    return update(function (st) {
      st.dailyDone += 1;
      var s = st.mcqStats[qId] || { attempts: 0, correct: 0, wrong: 0 };
      s.attempts += 1;
      if (isCorrect) s.correct += 1; else s.wrong += 1;
      st.mcqStats[qId] = s;
    });
  }

  function saveGameBest(gameId, score) {
    return update(function (st) {
      if (!st.gameBest[gameId] || score > st.gameBest[gameId]) st.gameBest[gameId] = score;
      st.dailyDone += 1;
      log(st, 'Game: ' + gameId, 'Score: ' + score);
    });
  }

  function resetAll() { var d = defaults(); save(d); return d; }

  return { KEY: KEY, load: load, save: save, update: update, log: log, recordMcq: recordMcq, saveGameBest: saveGameBest, resetAll: resetAll };
})();

  lessons: [
    {
      id: 'l1', num: 1,
      titleEn: 'HTML Background Colors (Names, RGB, HEX)',
      titleAr: 'ألوان خلفية الصفحة (الأسماء و RGB و HEX)',
      origQuestion: '1. Write code HTML for Set the background color by the following ways: Color Names, RGB Color Values, HEX Color Values',
      shortAnswer: 'Use the inline style attribute with background-color on <body>: color name (yellow), RGB value (rgb(255, 0, 0)), or HEX code (#ff0000).',
      pdfErrorNote: 'Source PDF Note: The original PDF wrote < body style="background-color: color:#ff0000;"> which has two syntax errors: (1) an extra space after < in "< body", and (2) an invalid "color:" keyword inside background-color. The technically correct code is: <body style="background-color: #ff0000;"></body>.',
      arExplain: 'علشان تغير لون خلفية الصفحة في HTML، بتضيف خاصية style جوه وسم <body> وتكتب background-color وبعدها اللون بواحدة من 3 طرق: اسم اللون (زي yellow)، أو نظام RGB اللي بياخد 3 أرقام للأحمر والأخضر والأزرق من 0 لـ 255 (زي rgb(255, 0, 0) للأحمر)، أو نظام HEX اللي بيبدأ بعلامة # وبعدها 6 خانات (زي #ff0000 للأحمر). خد بالك إن ملف المراجعة فيه غلطة مطبعية في مثال الـ HEX كتب color:#ff0000 جوه background-color وده غلط؛ الصح نكتب background-color: #ff0000; على طول.',
      tags: [
        { name: '<body>', desc: 'Holds the visible page content; styling its background-color colors the entire viewport.' },
        { name: 'style="..."', desc: 'Inline CSS attribute used to apply visual properties like background-color.' },

  mcqs: [
    { id: 'mcq-1', lessonId: 'l1', q: 'Which of the following correctly sets a red page background using a HEX color value?', opts: ['<body style="background-color: color:#ff0000;">', '<body style="background-color: #ff0000;">', '<body background="#ff0000">', '<body style="color: #ff0000;">'], correct: 1, exp: 'Valid inline CSS uses background-color: #ff0000; directly. Adding "color:" inside background-color (as in the PDF typo) is invalid, and "color:" alone changes text color, not background.' },
    { id: 'mcq-2', lessonId: 'l1', q: 'Which RGB value produces the exact same pure red color as #ff0000?', opts: ['rgb(0, 255, 0)', 'rgb(0, 0, 255)', 'rgb(255, 0, 0)', 'rgb(255, 255, 0)'], correct: 2, exp: 'In RGB (Red, Green, Blue), 255 for Red and 0 for Green and Blue produces pure red, matching #ff0000.' },
    { id: 'mcq-3', lessonId: 'l2', q: 'Which HTML element is the container for all visible content such as headings and paragraphs?', opts: ['<head>', '<body>', '<title>', '<meta>'], correct: 1, exp: '<body> holds all visible page content. <head>, <title>, and <meta> contain document metadata not rendered inside the page body.' },
    { id: 'mcq-4', lessonId: 'l2', q: 'In a basic HTML document, which tag defines the main top-level heading?', opts: ['<p>', '<heading>', '<h1>', '<head>'], correct: 2, exp: '<h1> defines the highest-level heading, whereas <p> defines a paragraph and <head> holds metadata.' },
    { id: 'mcq-5', lessonId: 'l3', q: 'What is the purpose of the alt attribute in <img src="hitu.jpg" alt="HITU Photo">?', opts: ['Sets the image border width', 'Provides alternative text if the image cannot load and for screen readers', 'Changes the image file format', 'Aligns the image to the left'], correct: 1, exp: 'alt gives accessible descriptive text for screen readers and displays if the image file fails to load.' },
    { id: 'mcq-6', lessonId: 'l3', q: 'Which statement about the HTML <img> element is TRUE?', opts: ['It requires a closing </img> tag', 'It is a void element with no closing tag', 'It uses href instead of src', 'It can only display .png files'], correct: 1, exp: '<img> is a void (empty) element with no closing tag, and it uses src (not href) to load JPG, PNG, SVG, WebP, etc.' },
    { id: 'mcq-7', lessonId: 'l4', q: 'Which tag is used to create a table header cell (such as "Student Name")?', opts: ['<td>', '<tr>', '<th>', '<thead>'], correct: 2, exp: '<th> defines a table header cell (bold and centered by default), while <td> is a regular data cell and <tr> is a row.' },
    { id: 'mcq-8', lessonId: 'l4', q: 'In HTML tables, every <th> or <td> cell must be placed directly inside which element?', opts: ['<tc>', '<tr>', '<col>', '<li>'], correct: 1, exp: '<tr> (Table Row) groups cells into a horizontal row inside <table>.' },
    { id: 'mcq-9', lessonId: 'l5', q: 'Which pair of tags creates a numbered list (1. Coffee, 2. Tea, 3. Milk)?', opts: ['<ul> and <li>', '<ol> and <li>', '<list> and <item>', '<dl> and <dt>'], correct: 1, exp: '<ol> stands for Ordered List (numbered), and <li> defines each list item. <ul> produces bullet points.' },
    { id: 'mcq-10', lessonId: 'l5', q: 'What happens if you replace <ol> with <ul> in the Coffee/Tea/Milk list?', opts: ['The list disappears', 'The numbers change into bullet points', 'The items become bold headings', 'The list turns horizontal'], correct: 1, exp: '<ul> (Unordered List) renders bullet points instead of 1, 2, 3 numbering.' },
    { id: 'mcq-11', lessonId: 'l6', q: 'How do you display the label "Click Me" on a standard <button> element?', opts: ['<button text="Click Me">', '<button>Click Me</button>', '<button alt="Click Me"></button>', '<btn>Click Me</btn>'], correct: 1, exp: 'A <button> displays whatever text or HTML sits between its opening and closing tags.' },
    { id: 'mcq-12', lessonId: 'l6', q: 'Which HTML tag name is valid for creating a button?', opts: ['<btn>', '<button>', '<click>', '<push>'], correct: 1, exp: '<button> is the standard HTML5 button element (alongside <input type="button">).' },
    { id: 'mcq-13', lessonId: 'l7', q: 'Which attribute runs JavaScript code when a user clicks a button?', opts: ['onpress', 'onclick', 'onrun', 'jsclick'], correct: 1, exp: 'onclick is the standard HTML event attribute triggered by a click.' },
    { id: 'mcq-14', lessonId: 'l7', q: 'Which button code uses valid quote nesting to show an alert saying Hello!?', opts: ['<button onclick="alert("Hello!")">Click Me</button>', '<button onclick="alert(\'Hello!\')">Click Me</button>', '<button click="alert(\'Hello!\')">Click Me</button>', '<button onclick="message(\'Hello!\')">Click Me</button>'], correct: 1, exp: 'Outer double quotes with inner single quotes prevent premature attribute termination, and alert() is the built-in JS alert function.' },
    { id: 'mcq-15', lessonId: 'l8', q: 'How does a <label> element associate itself with a specific <input> field?', opts: ['label.name matches input.value', 'label.for matches input.id', 'label.type matches input.type', 'label.action matches form.action'], correct: 1, exp: 'Setting <label for="fname"> and <input id="fname"> binds them together for clicking and accessibility.' },
    { id: 'mcq-16', lessonId: 'l8', q: 'Which attribute on <input type="text" id="fname" name="fname" value="John"> pre-fills "John" in the box?', opts: ['id', 'name', 'value', 'for'], correct: 2, exp: 'value sets the initial text inside a text input (and the caption on a submit input).' },
    { id: 'mcq-17', lessonId: 'l9', q: 'Which input type allows selecting ZERO or MORE options from a set of choices?', opts: ['radio', 'checkbox', 'text', 'submit'], correct: 1, exp: 'checkbox allows zero, one, or multiple selections, whereas radio allows only ONE selection in a group.' },
    { id: 'mcq-18', lessonId: 'l9', q: 'What is the main difference between <input type="submit"> and <input type="button">?', opts: ['submit sends the form data; button is a plain clickable button', 'button sends the form; submit does nothing', 'submit cannot have a value attribute', 'There is no difference'], correct: 0, exp: 'type="submit" submits the enclosing form to its action URL, while type="button" only runs custom scripts.' },
    { id: 'mcq-19', lessonId: 'l10', q: 'In <video width="400" controls>, what does the controls attribute add?', opts: ['Auto-downloads the video', 'Play, pause, volume, and fullscreen controls', 'Changes video resolution to 400p', 'Adds subtitles automatically'], correct: 1, exp: 'The controls attribute tells the browser to render built-in play, pause, timeline, volume, and fullscreen controls.' },
    { id: 'mcq-20', lessonId: 'l10', q: 'Which <source> tag correctly specifies an MP4 video named mov_HITU.mp4?', opts: ['<source href="mov_HITU.mp4" type="mp4">', '<source src="mov_HITU.mp4" type="video/mp4">', '<source file="mov_HITU.mp4" mime="video/mp4">', '<video src="mov_HITU.mp4" type="audio/mpeg">'], correct: 1, exp: '<source> uses src for the file path and type="video/mp4" for the MP4 MIME type.' },
    { id: 'mcq-21', lessonId: 'l11', q: 'Which MIME type is used inside <source> for an MP3 audio file like horse.mp3?', opts: ['audio/mp3-file', 'video/mp3', 'audio/mpeg', 'sound/mp3'], correct: 2, exp: 'The standard MIME type for MP3 audio in HTML5 is audio/mpeg.' },
    { id: 'mcq-22', lessonId: 'l11', q: 'How does <audio> differ from <video> in HTML5?', opts: ['<audio> cannot use <source>', '<audio> plays sound only without a visual video frame or fullscreen screen', '<audio> does not support the controls attribute', '<video> cannot play sound'], correct: 1, exp: 'Both support controls and <source>, but <audio> is for sound playback only (no visual viewport).' },
    { id: 'mcq-23', lessonId: 'l12', q: 'Which Web API runs JavaScript in the background without freezing the webpage UI?', opts: ['Web Storage API', 'Web Workers API', 'Canvas API', 'Geolocation API'], correct: 1, exp: 'Web Workers run JS in a background thread so users can keep clicking and scrolling smoothly.' },
    { id: 'mcq-24', lessonId: 'l12', q: 'Which Web API allows a webpage to automatically receive updates pushed from a server?', opts: ['Server-Sent Events API', 'Drag and Drop API', 'Web Storage API', 'Canvas API'], correct: 0, exp: 'Server-Sent Events (SSE) allows a browser page to automatically receive updates from a server.' },
    { id: 'mcq-25', lessonId: 'l13', q: 'Which attribute connects a <button> to a <div id="tip1" popover> element?', opts: ['target="tip1"', 'popovertarget="tip1"', 'for="tip1"', 'onclick="tip1"'], correct: 1, exp: 'popovertarget="tip1" tells the browser which popover element ID the button toggles.' },
    { id: 'mcq-26', lessonId: 'l13', q: 'What is a key benefit of the native HTML Popover API?', opts: ['It requires jQuery', 'It opens top-layer popups declaratively in HTML without writing JavaScript', 'It only works inside <table>', 'It replaces <form>'], correct: 1, exp: 'With popover and popovertarget, the browser handles opening, top-layer stacking, and light-dismiss automatically with zero JavaScript.' }
  ],

window.WAM_LESSONS = (function () {
  var currentLessonId = null;

    { no: '1', name: 'Ahmad', deg: '85' },

  ];

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function t(en, ar) {
    return (window.WAM_APP && window.WAM_APP.getLang() === 'ar') ? ar : en;
  }

  function getLesson(id) {
    var list = window.WAM_DATA.lessons;
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return list[0];
  }

  function getMcq(id) {
    var list = window.WAM_DATA.mcqs;
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  function selectLesson(id) {
    currentLessonId = id;
    window.WAM_STORAGE.update(function (st) { st.lastLessonId = id; });
    render();
  }

  function toggleComplete(id) {
    var added = false;
    window.WAM_STORAGE.update(function (st) {
      var idx = st.completedLessons.indexOf(id);
      if (idx === -1) {
        st.completedLessons.push(id);
        st.dailyDone += 1;
        added = true;
        var l = getLesson(id);
        window.WAM_STORAGE.log(st, 'Lesson Completed', 'L' + l.num + ': ' + l.titleEn);
      } else {
        st.completedLessons.splice(idx, 1);
      }
    });
    if (window.WAM_APP) {
      window.WAM_APP.toast(added ? t('Lesson marked completed!', 'تم تحديد الدرس كمكتمل!') : t('Lesson unmarked.', 'تم إلغاء اكتمال الدرس.'));
      window.WAM_APP.refreshMeta();
    }
    render();
  }

window.WAM_PLAYGROUND = (function () {

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function t(en, ar) {
    return (window.WAM_APP && window.WAM_APP.getLang() === 'ar') ? ar : en;
  }

  function loadCode(h, c, j) {
    htmlCode = h || '';
    cssCode = c || '';
    jsCode = j || '';
  }

  function checkBasicErrors(html, css) {
    var warns = [];
    if (/<\s+[a-zA-Z]/.test(html)) warns.push('Found a space right after "<" (e.g., "< body>"). Remove the space after "<".');
    if (/background-color\s*:\s*color\s*:/i.test(html + ' ' + css)) warns.push('Invalid CSS: "background-color: color:#..." — write "background-color: #ff0000;" directly.');
    if (/<\/img>/i.test(html)) warns.push('<img> is a void element and must not have a closing </img> tag.');
    if (/<button[^>]*onclick="[^"]*alert\("[^"]*"\)"/i.test(html)) warns.push('Nested double quotes inside onclick="alert("...")" will break HTML. Use single quotes inside.');
    return warns;
  }

  function runPreview() {
    var frame = document.getElementById('pg-iframe');
    var diag = document.getElementById('pg-diag');
    var warns = checkBasicErrors(htmlCode, cssCode);
    if (diag) {

        diag.className = 'fb-box warn';
        diag.innerHTML = '<strong>' + t('Basic Syntax Checks:', 'تنبيهات الصياغة:') + '</strong><ul style="margin:4px 0 0;padding-inline-start:18px;">' +
          warns.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul>';
      } else {
        diag.className = 'fb-box ok';
        diag.textContent = t('No basic syntax issues detected.', 'لا توجد أخطاء صياغة أساسية.');
      }
    }
    if (frame) {
      var doc = '<!DOCTYPE html><html><head><meta charset="UTF-8"><style>' + cssCode + '</style></head><body>' +
        htmlCode + '<script>try{' + jsCode + '}catch(e){document.body.insertAdjacentHTML("beforeend","<pre style=\\"color:#96352A;background:#F6E6E3;padding:8px;\\">JS Error: "+e.message+"</pre>");}<\/script></body></html>';

      '</div>' +

      '<div class="card-beige" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;">' +

    var sel = document.getElementById('pg-preset');

    if (sel) sel.addEventListener('change', function () {
      var id = this.value;
      for (var i = 0; i < presets.length; i++) {
        if (presets[i].id === id) {
          loadCode(presets[i].html, presets[i].css, presets[i].js);
          render();
          return;
        }
      }
    });
    document.getElementById('pg-auto').addEventListener('change', function () { autoRun = this.checked; });
    document.getElementById('pg-run').addEventListener('click', function () {
      htmlCode = hEl.value; cssCode = cEl.value; jsCode = jEl.value;
      runPreview();
    });
    document.getElementById('pg-reset').addEventListener('click', function () {
      loadCode('<h1>My First Heading</h1>\n<p>My first paragraph.</p>', 'body { font-family: Georgia, serif; padding: 16px; background: #FCF9F3; color: #2A201A; }', '');
      render();
    });
    document.getElementById('pg-copy').addEventListener('click', function () {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(hEl.value).catch(function () {});
      }
      if (window.WAM_APP) window.WAM_APP.toast(t('HTML code copied!', 'تم نسخ كود HTML!'));
    });

    [hEl, cEl, jEl].forEach(function (el) {
      el.addEventListener('input', function () {
        htmlCode = hEl.value; cssCode = cEl.value; jsCode = jEl.value;
        if (autoRun) runPreview();
      });
    });

    runPreview();
  }

  return { render: render, loadCode: loadCode, checkBasicErrors: checkBasicErrors };
})();


/* ==========================================================================
   Web App Mastery — MCQ, Essay/Coding Practice & Exam Center (js/quizzes.js)
   1) MCQ Practice (26 MCQs across all 13 lessons, instant feedback, retry wrong)
   2) Essay & Coding Practice (13 exercises, HTML tag/attr checker, rubric, saves)
   3) Exam Center (5 modes: Full, MCQ, Essay, Coding, Mixed + timer + nav grid)
   ========================================================================== */

window.WAM_QUIZZES = (function () {
  var mcqFilter = 'all';
  var mcqRandom = false;
  var mcqList = [];
  var mcqIdx = 0;
  var mcqAns = {};
  var mcqFinished = false;

  var activeEssayId = 'es-1';
  var essayShowModel = {};
  var essayRubric = {};

  var exam = null;
  var examTimerId = null;

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function t(en, ar) { return (window.WAM_APP && window.WAM_APP.getLang() === 'ar') ? ar : en; }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function checkTokens(text, tokens) {
    var lower = String(text || '').toLowerCase();
    var hits = [];
    (tokens || []).forEach(function (tk) {
      if (lower.indexOf(tk.toLowerCase()) !== -1) hits.push(tk);
    });
    return hits;
  }

  /* ========================================================================
     1. MCQ PRACTICE
     ======================================================================== */
  function buildMcqSession(custom) {
    var all = window.WAM_DATA.mcqs;
    var base = custom ? custom.slice() : all.filter(function (q) { return mcqFilter === 'all' || q.lessonId === mcqFilter; });
    mcqList = mcqRandom ? shuffle(base) : base;

  function renderMcq() {

    if (!mcqList.length && !mcqFinished) buildMcqSession();

      window.WAM_DATA.lessons.map(function (l) {
        return '<option value="' + l.id + '"' + (mcqFilter === l.id ? ' selected' : '') + '>L' + l.num + ': ' + esc(l.titleEn) + '</option>';
      }).join('');

    var bodyHtml = '';
    if (mcqFinished) {
      var okCnt = 0, wrongs = [];
      mcqList.forEach(function (q) { if (mcqAns[q.id] === q.correct) okCnt++; else wrongs.push(q); });
      var pct = mcqList.length ? Math.round((okCnt / mcqList.length) * 100) : 0;
      bodyHtml =

          '<h2 style="margin:4px 0 8px;font-family:var(--font-serif);">' + okCnt + ' / ' + mcqList.length + ' (' + pct + '%)</h2>' +
          '<div class="progress-track" style="margin-bottom:14px;"><div class="progress-fill" style="width:' + pct + '%;"></div></div>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">' +
            '<button type="button" class="btn btn-primary" id="btn-mcq-again">' + t('Practice Again', 'إعادة التدريب') + '</button>' +
            (wrongs.length ? '<button type="button" class="btn btn-secondary" id="btn-mcq-wrong">' + t('Retry Incorrect (' + wrongs.length + ')', 'إعادة الخاطئة (' + wrongs.length + ')') + '</button>' : '') +
          '</div>' +
          mcqList.map(function (q, i) {

          '<div class="opt-list">' +

            }).join('') +
          '</div>' +
          (ans ? '<div class="fb-box ' + (ch === q.correct ? 'ok' : 'err') + '" dir="ltr"><strong>' + (ch === q.correct ? t('Correct! ', 'إجابة صحيحة! ') : t('Incorrect. ', 'إجابة خاطئة. ')) + '</strong>' + esc(q.exp) + '</div>' : '') +
          '<div style="display:flex;justify-content:space-between;gap:8px;margin-top:16px;">' +
            '<button type="button" class="btn btn-secondary" id="btn-mcq-prev"' + (mcqIdx === 0 ? ' disabled' : '') + '>' + t('← Prev', '→ السابق') + '</button>' +
            (mcqIdx < mcqList.length - 1

              : '<button type="button" class="btn btn-primary" id="btn-mcq-fin">' + t('Finish & Review', 'إنهاء ومراجعة') + '</button>') +
          '</div>' +
        '</div>';
    }

    root.innerHTML =
      '<div class="page-head">' +
        '<div class="eyebrow">' + t('MCQ Practice · All 13 Lessons', 'تدريب الاختيار من متعدد · 13 درساً') + '</div>' +
        '<h1 class="page-title">' + t('Interactive MCQ Practice', 'تدريب أسئلة الاختيار من متعدد') + '</h1>' +
        '<p class="page-sub">' + t('Green/red instant feedback, detailed explanations, lesson filters, random order, and retry wrong mode.', 'تقييم فوري وشرح تفصيلي وتصفية حسب الدرس وإعادة الأسئلة الخاطئة.') + '</p>' +
      '</div>' +
      '<div class="card-beige" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;">' +
        '<select class="select" id="sel-mcq-l" style="flex:1;min-width:200px;">' + lessonOpts + '</select>' +
        '<label style="display:inline-flex;align-items:center;gap:6px;font-size:0.86rem;font-weight:600;cursor:pointer;"><input type="checkbox" id="chk-mcq-r"' + (mcqRandom ? ' checked' : '') + '> ' + t('Random Mode', 'عشوائي') + '</label>' +
        '<button type="button" class="btn btn-secondary btn-sm" id="btn-mcq-go">' + t('Restart', 'إعادة') + '</button>' +
      '</div>' + bodyHtml;

    document.getElementById('sel-mcq-l').addEventListener('change', function () { mcqFilter = this.value; buildMcqSession(); renderMcq(); });
    document.getElementById('chk-mcq-r').addEventListener('change', function () { mcqRandom = this.checked; buildMcqSession(); renderMcq(); });
    document.getElementById('btn-mcq-go').addEventListener('click', function () { buildMcqSession(); renderMcq(); });

    var oBtns = root.querySelectorAll('[data-mcq-opt]');
    for (var i = 0; i < oBtns.length; i++) {
      oBtns[i].addEventListener('click', function () {
        var q = mcqList[mcqIdx];
        if (!q || mcqAns[q.id] !== undefined) return;
        var oi = parseInt(this.getAttribute('data-mcq-opt'), 10);
        mcqAns[q.id] = oi;
        window.WAM_STORAGE.recordMcq(q.id, oi === q.correct);
        if (window.WAM_APP) window.WAM_APP.refreshMeta();

    var bP = document.getElementById('btn-mcq-prev'), bN = document.getElementById('btn-mcq-next'), bF = document.getElementById('btn-mcq-fin'), bA = document.getElementById('btn-mcq-again'), bW = document.getElementById('btn-mcq-wrong');
    if (bP) bP.addEventListener('click', function () { mcqIdx--; renderMcq(); });
    if (bN) bN.addEventListener('click', function () { mcqIdx++; renderMcq(); });
    if (bF) bF.addEventListener('click', function () {
      mcqFinished = true;
      var c = 0; mcqList.forEach(function (q) { if (mcqAns[q.id] === q.correct) c++; });
      window.WAM_STORAGE.update(function (s) { window.WAM_STORAGE.log(s, 'MCQ Practice', c + '/' + mcqList.length + ' correct'); });
      renderMcq();
    });
    if (bA) bA.addEventListener('click', function () { buildMcqSession(); renderMcq(); });
    if (bW) bW.addEventListener('click', function () { buildMcqSession(mcqList.filter(function (q) { return mcqAns[q.id] !== q.correct; })); renderMcq(); });
  }

  /* ========================================================================
     2. ESSAY & CODING PRACTICE (Basic HTML Tag/Attr Checker + Self-Rubric)
     ======================================================================== */
  function renderEssay() {

        '<h1 class="page-title">' + t('Write HTML Code & Model Answers', 'كتابة أكواد HTML والإجابات المقالية') + '</h1>' +
        '<p class="page-sub">' + t('Basic automated tag/attribute checker highlights required tokens in real time. Compare against the model answer and self-check honestly — simple token matching is a study aid, not full grading.', 'فحص تلقائي للوسوم والخصائص الأساسية مع الإجابة النموذجية ومعيار التقييم الذاتي.') + '</p>' +
      '</div>' +
      '<div class="tabs">' + tabsHtml + '</div>' +
      '<div class="card" style="margin-bottom:14px;">' +
        '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px;">' +
          '<span class="badge badge-beige">' + esc(cur.style) + ' · ' + esc(cur.lessonId.toUpperCase()) + '</span>' +
          '<span style="font-size:0.84rem;color:var(--muted);">' + t('Required Tags/Keywords Found: ', 'الوسوم/الكلمات المطابقة: ') + '<strong id="es-hit-cnt">' + hits.length + ' / ' + cur.requiredTokens.length + '</strong></span>' +
        '</div>' +
        '<h2 style="margin:0 0 10px;font-size:1.1rem;" dir="ltr">' + esc(cur.prompt) + '</h2>' +
        '<textarea id="es-ta" class="' + (cur.isCode ? 'code-editor' : 'textarea') + '" dir="ltr" placeholder="Write your HTML code or structured exam answer here...">' + esc(saved.text || '') + '</textarea>' +
        '<div style="margin-top:12px;"><div class="eyebrow" style="margin-bottom:6px;">' + t('Basic Tag & Keyword Checker (Transparent Match)', 'فحص الوسوم والكلمات الأساسية') + '</div><div id="es-chips" style="display:flex;flex-wrap:wrap;gap:6px;">' + chipsHtml + '</div></div>' +

          (cur.isCode ? '<button type="button" class="btn btn-secondary btn-sm" id="btn-es-pg">' + t('Test in Playground', 'اختبر في المحرر') + '</button>' : '') +
        '</div>' +
        (showM ? '<div class="card-beige" style="margin-top:14px;" dir="ltr"><div class="eyebrow">Model Answer</div><pre class="code-box">' + esc(cur.model) + '</pre><div class="ar-box"><div style="font-size:0.78rem;font-weight:800;color:var(--cinnamon);margin-bottom:3px;">الشرح بالعامية المصرية</div>' + esc(cur.ar) + '</div></div>' : '') +
      '</div>' +

        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">' +
          '<div class="eyebrow">' + t('Self-Assessment Marking Checklist', 'قائمة التقييم الذاتي') + '</div>' +

  /* ========================================================================
     3. EXAM CENTER (5 Modes: Full, MCQ, Essay, Coding, Mixed)
     ======================================================================== */
  function stopTimer() { if (examTimerId) { clearInterval(examTimerId); examTimerId = null; } }
  function fmt(sec) { return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0'); }

  function startExam(mode, mins) {
    stopTimer();
    var mcqs = shuffle(window.WAM_DATA.mcqs);
    var essays = shuffle(window.WAM_DATA.essays);
    var coding = shuffle(window.WAM_DATA.essays.filter(function (e) { return e.isCode; }));
    var items = [];

    if (mode === 'full') {
      mcqs.slice(0, 15).forEach(function (q) { items.push({ type: 'mcq', data: q }); });
      essays.slice(0, 5).forEach(function (e) { items.push({ type: 'essay', data: e }); });
    } else if (mode === 'mcq') {
      mcqs.slice(0, 20).forEach(function (q) { items.push({ type: 'mcq', data: q }); });
    } else if (mode === 'essay') {
      essays.slice(0, 5).forEach(function (e) { items.push({ type: 'essay', data: e }); });
    } else if (mode === 'coding') {
      coding.slice(0, 6).forEach(function (e) { items.push({ type: 'essay', data: e }); });
    } else {
      mcqs.slice(0, 10).forEach(function (q) { items.push({ type: 'mcq', data: q }); });
      coding.slice(0, 3).forEach(function (e) { items.push({ type: 'essay', data: e }); });
    }

    exam = { mode: mode, items: items, idx: 0, answers: {}, flagged: {}, remainingSec: Math.max(1, parseInt(mins, 10) || 15) * 60, submitted: false };
    examTimerId = setInterval(function () {
      if (!exam || exam.submitted) { stopTimer(); return; }

  }

  return { render: render, startGame: startGame };
})();

      window.WAM_STORAGE.update(function (s) {
        var arr = act === 'fav' ? s.qBankFavorites : (act === 'diff' ? s.qBankDifficult : s.qBankCompleted);
        var idx = arr.indexOf(id); if (idx === -1) arr.push(id); else arr.splice(idx, 1);
      });
      renderQBank();
    });
  }

  /* ========================================================================
     FLASHCARDS
     ======================================================================== */
  function buildFc(shuf) {
    var st = window.WAM_STORAGE.load(), all = window.WAM_DATA.flashcards;
    var base = fcMode === 'difficult' ? all.filter(function (c) { return st.flashStatus[c.id] === 'dont'; }) : all.slice();
    if (shuf) for (var i = base.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var x = base[i]; base[i] = base[j]; base[j] = x; }
    fcList = base; fcIdx = 0; fcFlipped = false;
  }

  function renderFlashcards() {
    var root = document.getElementById('view-flashcards');
    if (!root) return;
    var st = window.WAM_STORAGE.load();
    if (!fcList.length && fcMode === 'all') buildFc(false);
    var kCnt = 0, dCnt = 0;
    window.WAM_DATA.flashcards.forEach(function (c) { if (st.flashStatus[c.id] === 'know') kCnt++; else if (st.flashStatus[c.id] === 'dont') dCnt++; });

    var body = !fcList.length
      ? '<div class="empty-box">' + t('No difficult cards marked right now.', 'لا توجد بطاقات صعبة حالياً.') + '</div>'
      : (function () {
          if (fcIdx >= fcList.length) fcIdx = 0;
          var c = fcList[fcIdx];
          return '<div style="text-align:center;font-size:0.84rem;color:var(--muted);margin-bottom:8px;">Card ' + (fcIdx + 1) + ' / ' + fcList.length + '</div>' +
            '<div class="flash-card" id="fc-box">' +
              (!fcFlipped
                ? '<div class="eyebrow" style="text-align:center;">Click Card to Flip</div><h2 style="text-align:center;margin:8px 0;font-family:var(--font-serif);font-size:1.45rem;" dir="ltr">' + esc(c.front) + '</h2>'
                : '<div class="eyebrow">Definition &amp; Example</div><div style="font-weight:700;" dir="ltr">' + esc(c.backEn) + '</div><div class="ar-box">' + esc(c.backAr) + '</div><pre class="code-box" style="margin:0;" dir="ltr">' + esc(c.ex) + '</pre>') +
            '</div>' +
            '<div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap;">' +
              '<button type="button" class="btn btn-secondary" id="fc-p">← Prev</button>' +
              '<button type="button" class="btn btn-secondary" id="fc-d">Don\'t Know It</button>' +
              '<button type="button" class="btn btn-primary" id="fc-k">Know It ✓</button>' +
              '<button type="button" class="btn btn-secondary" id="fc-n">Next →</button>' +
            '</div>';
        })();

    root.innerHTML =
      '<div class="page-head"><div class="eyebrow">' + t('Flashcards · 20 Key Concepts', 'البطاقات التعليمية · 20 مفهوماً') + '</div><h1 class="page-title">' + t('Interactive Study Flashcards', 'البطاقات التعليمية التفاعلية') + '</h1></div>' +
      '<div class="card-beige" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:16px;">' +
        '<div style="display:flex;gap:6px;"><button type="button" class="tab' + (fcMode === 'all' ? ' active' : '') + '" id="fc-all">All (20)</button><button type="button" class="tab' + (fcMode === 'difficult' ? ' active' : '') + '" id="fc-diff">Difficult (' + dCnt + ')</button><button type="button" class="btn btn-secondary btn-sm" id="fc-shuf">Random</button></div>' +
        '<span class="badge badge-ok">Memorized: ' + kCnt + ' / 20</span>' +
      '</div>' + body;

    document.getElementById('fc-all').addEventListener('click', function () { fcMode = 'all'; buildFc(false); renderFlashcards(); });
    document.getElementById('fc-diff').addEventListener('click', function () { fcMode = 'difficult'; buildFc(false); renderFlashcards(); });
    document.getElementById('fc-shuf').addEventListener('click', function () { buildFc(true); renderFlashcards(); });
    var bx = document.getElementById('fc-box'); if (bx) bx.addEventListener('click', function () { fcFlipped = !fcFlipped; renderFlashcards(); });
    var bp = document.getElementById('fc-p'), bn = document.getElementById('fc-n'), bk = document.getElementById('fc-k'), bd = document.getElementById('fc-d');
    if (bp) bp.addEventListener('click', function () { fcIdx = (fcIdx - 1 + fcList.length) % fcList.length; fcFlipped = false; renderFlashcards(); });
    if (bn) bn.addEventListener('click', function () { fcIdx = (fcIdx + 1) % fcList.length; fcFlipped = false; renderFlashcards(); });
    if (bk) bk.addEventListener('click', function () { window.WAM_STORAGE.update(function (s) { s.flashStatus[fcList[fcIdx].id] = 'know'; s.dailyDone += 1; }); fcIdx = (fcIdx + 1) % fcList.length; fcFlipped = false; renderFlashcards(); });
    if (bd) bd.addEventListener('click', function () { window.WAM_STORAGE.update(function (s) { s.flashStatus[fcList[fcIdx].id] = 'dont'; s.dailyDone += 1; }); fcIdx = (fcIdx + 1) % fcList.length; fcFlipped = false; renderFlashcards(); });
  }

  /* ========================================================================
     PROGRESS & STATS
     ======================================================================== */
  function renderProgress() {
    var root = document.getElementById('view-progress');
    if (!root) return;
    var st = window.WAM_STORAGE.load(), m = calcStats(st), weak = getWeakLessons(st).slice(0, 5);
    var savedEssays = Object.keys(st.essayDrafts || {}).filter(function (k) { return st.essayDrafts[k] && st.essayDrafts[k].text; }).length;
    var examRows = (st.examHistory && st.examHistory.length)
      ? st.examHistory.slice(0, 8).map(function (e) { return '<tr><td>' + esc(e.mode) + '</td><td>' + e.correct + '/' + e.total + '</td><td><strong>' + e.pct + '%</strong></td></tr>'; }).join('')
      : '<tr><td colspan="3" style="color:var(--muted);">No exams taken yet.</td></tr>';

    root.innerHTML =
      '<div class="page-head" style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;">' +
        '<div><div class="eyebrow">' + t('Progress Tracking', 'تتبع التقدم') + '</div><h1 class="page-title">' + t('Your Performance & Mastery', 'أداؤك ومستوى الإتقان') + '</h1></div>' +
        '<button type="button" class="btn btn-danger btn-sm" id="btn-reset-all">' + t('Reset All Progress', 'إعادة تعيين كل التقدم') + '</button>' +
      '</div>' +
      '<div class="stats-grid">' +
        '<div class="stat-box"><div class="stat-k">Total Progress</div><div class="stat-v">' + m.overall + '%</div></div>' +
        '<div class="stat-box"><div class="stat-k">Lessons Done</div><div class="stat-v">' + m.doneL + ' / 13</div></div>' +
        '<div class="stat-box"><div class="stat-k">Correct / Wrong</div><div class="stat-v">' + m.cor + ' / ' + m.wrg + '</div></div>' +
        '<div class="stat-box"><div class="stat-k">Coding/Essays Saved</div><div class="stat-v">' + savedEssays + ' / 13</div></div>' +
      '</div>' +
      '<div class="grid-2" style="margin-bottom:16px;">' +
        '<div class="card"><div class="eyebrow" style="margin-bottom:8px;">Weak Topics &amp; Recommended Lessons</div>' +
          weak.map(function (w) { return '<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);"><span><strong>L' + w.lesson.num + ':</strong> ' + esc(w.lesson.titleEn) + '</span><button type="button" class="btn btn-secondary btn-sm" data-ol="' + w.lesson.id + '">Study</button></div>'; }).join('') +
        '</div>' +
        '<div class="card"><div class="eyebrow" style="margin-bottom:8px;">Exam History</div><div class="table-wrap"><table class="table"><thead><tr><th>Mode</th><th>Score</th><th>%</th></tr></thead><tbody>' + examRows + '</tbody></table></div></div>' +
      '</div>' +
      '<div class="card"><div class="eyebrow" style="margin-bottom:10px;">Game Zone High Scores</div><div class="grid-3">' +
        ['detective', 'complete', 'findError', 'match', 'tf', 'buildPage'].map(function (g) {
          return '<div class="card-beige" style="display:flex;justify-content:space-between;"><strong>' + esc(g) + '</strong><span class="badge badge-ok">' + (st.gameBest[g] || 0) + '</span></div>';
        }).join('') +
      '</div></div>';

    var ols = root.querySelectorAll('[data-ol]');
    for (var i = 0; i < ols.length; i++) ols[i].addEventListener('click', function () { var id = this.getAttribute('data-ol'); navigate('lessons'); if (window.WAM_LESSONS) window.WAM_LESSONS.selectLesson(id); });
    document.getElementById('btn-reset-all').addEventListener('click', function () {
      confirmModal(t('Reset All Progress?', 'إعادة تعيين كل التقدم؟'), t('All lessons, quiz scores, exams, code attempts, flashcards, and game high scores will be cleared.', 'سيتم مسح جميع التقدم والنتائج والمسودات.'), t('Yes, Reset', 'نعم، مسح'), function () {
        window.WAM_STORAGE.resetAll();
        toast(t('Progress reset.', 'تم مسح التقدم.'));
        renderCurrentView();
      });
    });
  }

  function renderCurrentView() {
    var views = document.querySelectorAll('.view');
    for (var i = 0; i < views.length; i++) views[i].classList.remove('active');
    var target = document.getElementById('view-' + currentView);
    if (target) target.classList.add('active');
    renderSidebar();
    refreshMeta();

    if (currentView === 'home') renderHome();
    else if (currentView === 'lessons' && window.WAM_LESSONS) window.WAM_LESSONS.render();
    else if (currentView === 'playground' && window.WAM_PLAYGROUND) window.WAM_PLAYGROUND.render();
    else if (currentView === 'qbank') renderQBank();
    else if (currentView === 'mcq' && window.WAM_QUIZZES) window.WAM_QUIZZES.renderMcq();
    else if (currentView === 'essay' && window.WAM_QUIZZES) window.WAM_QUIZZES.renderEssay();
    else if (currentView === 'exam' && window.WAM_QUIZZES) window.WAM_QUIZZES.renderExam();
    else if (currentView === 'games' && window.WAM_GAMES) window.WAM_GAMES.render();
    else if (currentView === 'flashcards') renderFlashcards();
    else if (currentView === 'progress') renderProgress();
  }

  function navigate(id) { currentView = id; renderCurrentView(); if (typeof window.scrollTo === 'function') window.scrollTo(0, 0); }

  function init() {
    var st = window.WAM_STORAGE.load();
    lang = st.lang || 'en';
    theme = st.theme || 'light';

    var bl = document.getElementById('btn-lang'), bt = document.getElementById('btn-theme'), bm = document.getElementById('btn-menu'), bk = document.getElementById('sidebar-backdrop');
    if (bl) bl.addEventListener('click', function () { lang = lang === 'en' ? 'ar' : 'en'; window.WAM_STORAGE.update(function (s) { s.lang = lang; }); applyThemeAndLang(); renderCurrentView(); });
    if (bt) bt.addEventListener('click', function () { theme = theme === 'light' ? 'dark' : 'light'; window.WAM_STORAGE.update(function (s) { s.theme = theme; }); applyThemeAndLang(); });
    if (bm) bm.addEventListener('click', openSidebar);
    if (bk) bk.addEventListener('click', closeSidebar);

    applyThemeAndLang();
    renderCurrentView();
  }

  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
  }

  return { init: init, navigate: navigate, getLang: getLang, toast: toast, confirmModal: confirmModal, refreshMeta: refreshMeta, renderCurrentView: renderCurrentView };
})();

  </script>
</body>
</html>
